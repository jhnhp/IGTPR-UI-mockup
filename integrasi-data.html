<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/x-icon" href="assets/img/geoportalLogo.ico">
    <title>Geoportal IGT-PR - Integrasi Data</title>

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="assets/lib/remixicon/fonts/remixicon.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=20261026f">
    <link rel="stylesheet" href="assets/css/igt-components.css?v=20261026f">
    <link rel="stylesheet" href="assets/css/layout.css?v=20261026f">
    <link rel="stylesheet" href="assets/css/data-saya.css?v=20261026f">
</head>

<body data-title="Integrasi Data" data-halaman="integrasi">
    <!-- Layout bersama dirender oleh assets/js/core/layout.js -->
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <div class="main main-app p-3 p-lg-4">
        <div id="app-role-banner"></div>

        <div class="igt-card mb-4 igt-ds">
            <div class="igt-card__head">
                <div>
                    <h6 class="igt-card__title">Integrasi Data</h6>
                    <span class="igt-data-ringkas" id="data-ringkas"></span>
                </div>
                <div class="igt-card__tools">
                    <div class="igt-searchbar">
                        <span class="igt-searchbar__icon"><img src="assets/img/icons/magnifying-glass.svg" alt=""></span>
                        <input type="search" id="data-cari" placeholder="Cari sesuatu...">
                    </div>
                    <div class="igt-segment" role="group" id="data-tab"><button type="button" class="igt-segment__item is-active" data-status="semua">Semua</button><button type="button" class="igt-segment__item" data-status="terintegrasi">Terintegrasi</button></div>
                </div>
            </div>
            <div class="igt-table-wrap">
                <table class="igt-table">
                    <thead><tr><th class="igt-table__no is-plain">No</th><th>Nama IGT</th><th>Jenis Data</th><th>Tanggal Upload</th><th>Status</th><th>Keterangan / Catatan</th></tr></thead>
                    <tbody id="data-body"></tbody>
                </table>
            </div>
        </div>

        <div id="app-footer"></div>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/dummy-data.js?v=20261026f"></script>
    <script src="assets/js/core/layout.js?v=20261026f"></script>
    <script src="assets/js/core/data-saya.js?v=20261026f"></script>
    <script src="assets/js/pages/data/data.js?v=20261026f"></script>
</body>
</html>
